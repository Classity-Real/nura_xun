name: postmarketOS Setup + Firmware Extract (xun)

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI for pmbootstrap init"
        required: true
        default: "gnome"
        type: choice
        options:
          - gnome
          - phosh
          - plasma-mobile
          - sxmo-de-sway
          - xfce4
          - console
          - none
      rom_url:
        description: "Direct URL to Xiaomi fastboot .tgz"
        required: false
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VMUMIXM/xun_global_images_OS2.0.209.0.VMUMIXM_20260622.0000.00_15.0_global_0dee6f46cf.tgz"

permissions:
  contents: write   # needed to push the extracted firmware back

jobs:
  extract-and-commit-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl wget tar gzip android-sdk-libsparse-utils \
            mtools dosfstools p7zip-full

      - name: Download Xiaomi fastboot ROM
        run: |
          set -eux
          echo "Downloading ROM (this takes a while)..."
          curl -L --fail --retry 3 --retry-delay 15 \
            -o /tmp/xun-fastboot.tgz \
            "${{ inputs.rom_url }}"
          ls -lh /tmp/xun-fastboot.tgz

      - name: Extract fastboot package
        run: |
          set -eux
          mkdir -p /tmp/rom
          tar -xzf /tmp/xun-fastboot.tgz -C /tmp/rom
          find /tmp/rom -type d -name "images" | head -1 > /tmp/images_dir.txt
          IMAGES_DIR=$(cat /tmp/images_dir.txt)
          echo "Images directory: $IMAGES_DIR"
          ls -lh "$IMAGES_DIR" | head -40

      - name: Extract modem + bluetooth firmware
        run: |
          set -eux
          IMAGES_DIR=$(cat /tmp/images_dir.txt)
          mkdir -p /tmp/extract/{modem_mnt,bt_mnt}

          convert_if_sparse() {
            local src="$1" dst="$2"
            if file "$src" | grep -qi sparse; then
              echo "Converting sparse image $src"
              simg2img "$src" "$dst"
            else
              cp "$src" "$dst"
            fi
          }

          # Modem
          MODEM_IMG=$(find "$IMAGES_DIR" -iname "modem.img" | head -1 || true)
          if [ -n "$MODEM_IMG" ]; then
            convert_if_sparse "$MODEM_IMG" /tmp/extract/modem.raw
            sudo mount -o loop,ro /tmp/extract/modem.raw /tmp/extract/modem_mnt || \
              sudo mount -t vfat -o loop,ro /tmp/extract/modem.raw /tmp/extract/modem_mnt || true
            echo "=== modem contents ==="
            ls /tmp/extract/modem_mnt/ || true
            ls /tmp/extract/modem_mnt/image/ 2>/dev/null || true
          else
            echo "WARNING: modem.img not found"
          fi

          # Bluetooth
          BT_IMG=$(find "$IMAGES_DIR" -iname "bluetooth.img" | head -1 || true)
          if [ -n "$BT_IMG" ]; then
            convert_if_sparse "$BT_IMG" /tmp/extract/bt.raw
            sudo mount -o loop,ro /tmp/extract/bt.raw /tmp/extract/bt_mnt || \
              sudo mount -t vfat -o loop,ro /tmp/extract/bt.raw /tmp/extract/bt_mnt || true
            echo "=== bluetooth contents ==="
            ls /tmp/extract/bt_mnt/ || true
            ls /tmp/extract/bt_mnt/image/ 2>/dev/null || true
          else
            echo "WARNING: bluetooth.img not found"
          fi

          # Build the final structure
          FW=build/firmware
          mkdir -p $FW/{qcom/sm6225/xiaomi/xun,qcom,qca,ath10k/WCN3990/hw1.0}

          if [ -d /tmp/extract/modem_mnt/image ]; then
            cp -v /tmp/extract/modem_mnt/image/adsp*          $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/modem*         $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/wlanmdsp.mbn   $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/bdwlan*        $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/bd84*          $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
          fi

          if [ -d /tmp/extract/bt_mnt/image ]; then
            cp -v /tmp/extract/bt_mnt/image/cmbtfw13.tlv $FW/qca/crbtfw13.tlv 2>/dev/null || true
            cp -v /tmp/extract/bt_mnt/image/cmnv13.bin   $FW/qca/crnv13.bin   2>/dev/null || true
          fi

          echo "=== Final firmware files ==="
          find $FW -type f | sort
          du -sh $FW

      - name: Commit and push firmware
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build/firmware/
          if git diff --cached --quiet; then
            echo "No firmware files to commit"
          else
            git commit -m "firmware: add extracted blobs for xiaomi-xun

Extracted from official Xiaomi fastboot ROM via CI"
            git push
            echo "Firmware committed and pushed"
          fi

      - name: Upload artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiaomi-xun
          path: build/firmware/
          retention-days: 30
