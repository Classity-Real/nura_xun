name: postmarketOS Setup + Firmware Extract (xun)

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI for pmbootstrap init"
        required: true
        default: "gnome"
        type: choice
        options:
          - gnome
          - phosh
          - plasma-mobile
          - sxmo-de-sway
          - xfce4
          - console
          - none
      rom_url:
        description: "Direct URL to Xiaomi fastboot .tgz (leave default for latest Global)"
        required: false
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VMUMIXM/xun_global_images_OS2.0.209.0.VMUMIXM_20260622.0000.00_15.0_global_0dee6f46cf.tgz"

jobs:
  extract-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # large download needs time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl wget tar gzip android-sdk-libsparse-utils \
            mtools dosfstools p7zip-full

      - name: Download Xiaomi fastboot ROM
        run: |
          set -eux
          echo "Downloading ROM (this will take a while)..."
          curl -L --fail --retry 3 --retry-delay 10 \
            -o /tmp/xun-fastboot.tgz \
            "${{ inputs.rom_url }}"
          ls -lh /tmp/xun-fastboot.tgz

      - name: Extract fastboot package
        run: |
          set -eux
          mkdir -p /tmp/rom
          tar -xzf /tmp/xun-fastboot.tgz -C /tmp/rom
          # Find the images directory (structure can vary slightly)
          find /tmp/rom -type d -name "images" | head -1 > /tmp/images_dir.txt
          IMAGES_DIR=$(cat /tmp/images_dir.txt)
          echo "Images dir: $IMAGES_DIR"
          ls -lh "$IMAGES_DIR" | head -30

      - name: Locate modem and bluetooth images
        run: |
          set -eux
          IMAGES_DIR=$(cat /tmp/images_dir.txt)
          find "$IMAGES_DIR" -iname "*modem*" -o -iname "*bluetooth*" | tee /tmp/fw_images.txt
          ls -lh $(cat /tmp/fw_images.txt) || true

      - name: Convert sparse images if needed and extract firmware
        run: |
          set -eux
          IMAGES_DIR=$(cat /tmp/images_dir.txt)
          mkdir -p /tmp/extract/{modem,bt,firmware}

          # Helper: convert sparse -> raw if necessary
          convert_if_sparse() {
            local src="$1"
            local dst="$2"
            if file "$src" | grep -q sparse; then
              echo "Converting sparse $src ..."
              simg2img "$src" "$dst"
            else
              cp "$src" "$dst"
            fi
          }

          # Modem
          MODEM_IMG=$(find "$IMAGES_DIR" -iname "modem.img" | head -1 || true)
          if [ -n "$MODEM_IMG" ]; then
            convert_if_sparse "$MODEM_IMG" /tmp/extract/modem.raw
            mkdir -p /tmp/extract/modem_mnt
            sudo mount -o loop,ro /tmp/extract/modem.raw /tmp/extract/modem_mnt || true
            ls /tmp/extract/modem_mnt/ || true
            ls /tmp/extract/modem_mnt/image/ 2>/dev/null || true
          fi

          # Bluetooth
          BT_IMG=$(find "$IMAGES_DIR" -iname "bluetooth.img" | head -1 || true)
          if [ -n "$BT_IMG" ]; then
            convert_if_sparse "$BT_IMG" /tmp/extract/bt.raw
            mkdir -p /tmp/extract/bt_mnt
            sudo mount -o loop,ro /tmp/extract/bt.raw /tmp/extract/bt_mnt || true
            ls /tmp/extract/bt_mnt/ || true
            ls /tmp/extract/bt_mnt/image/ 2>/dev/null || true
          fi

          # Collect files into the expected structure
          FW=/tmp/extract/firmware
          mkdir -p $FW/{qcom/sm6225/xiaomi/xun,qcom,qca,ath10k/WCN3990/hw1.0}

          # From modem
          if [ -d /tmp/extract/modem_mnt/image ]; then
            cp -v /tmp/extract/modem_mnt/image/adsp*          $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/modem*         $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/wlanmdsp.mbn   $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/bdwlan*        $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/extract/modem_mnt/image/bd84*          $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
          fi

          # From bluetooth
          if [ -d /tmp/extract/bt_mnt/image ]; then
            cp -v /tmp/extract/bt_mnt/image/cmbtfw13.tlv $FW/qca/crbtfw13.tlv 2>/dev/null || true
            cp -v /tmp/extract/bt_mnt/image/cmnv13.bin   $FW/qca/crnv13.bin   2>/dev/null || true
          fi

          echo "=== Collected firmware files ==="
          find $FW -type f | sort
          du -sh $FW

      - name: Create firmware tarball
        run: |
          set -eux
          cd /tmp/extract
          tar -czf firmware-xiaomi-xun.tar.gz -C firmware .
          ls -lh firmware-xiaomi-xun.tar.gz
          # Also put a copy into the repo tree for convenience
          mkdir -p $GITHUB_WORKSPACE/build/firmware
          tar -xzf firmware-xiaomi-xun.tar.gz -C $GITHUB_WORKSPACE/build/firmware

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiaomi-xun
          path: /tmp/extract/firmware-xiaomi-xun.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "============================================================"
          echo "Firmware extraction finished"
          echo "============================================================"
          echo "Artifact: firmware-xiaomi-xun.tar.gz"
          echo "You can download it from the Actions run page."
          echo ""
          echo "To use it locally:"
          echo "  mkdir -p build/firmware"
          echo "  tar -xzf firmware-xiaomi-xun.tar.gz -C build/firmware"
          echo "  ./scripts/sync-pmaports.sh"
