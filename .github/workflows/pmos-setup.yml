name: postmarketOS Setup (xun)

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI to select during pmbootstrap init (gnome is the one used by this port)"
        required: true
        default: "gnome"
        type: choice
        options:
          - gnome
          - phosh
          - plasma-mobile
          - sxmo-de-sway
          - xfce4
          - console
          - none
      firmware_url:
        description: "Optional URL to a pre-extracted firmware-xiaomi-xun.tar.gz (or empty)"
        required: false
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    # pmbootstrap needs root for some chroot operations
    # and we deliberately install it system-wide.

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-setuptools python3-wheel \
            curl wget rsync sudo \
            build-essential libssl-dev libffi-dev \
            android-tools-adb android-tools-fastboot \
            e2fsprogs

      - name: Install pmbootstrap (as root)
        run: |
          set -eux
          # Official recommended way + system-wide so "pmbootstrap" is in PATH for root
          sudo pip3 install --break-system-packages pmbootstrap
          pmbootstrap --version || true
          which pmbootstrap

      - name: Create build/firmware structure
        run: |
          set -eux
          mkdir -p build/firmware/qcom/sm6225/xiaomi/xun
          mkdir -p build/firmware/qcom/sm4250
          mkdir -p build/firmware/qcom
          mkdir -p build/firmware/ath10k/WCN3990/hw1.0
          mkdir -p build/firmware/qca

          cat > build/firmware/README.md << 'EOF'
# Firmware for xiaomi-xun (Redmi Pad SE)

This directory is **required** by the port and by the `firmware-xiaomi-xun`
package in pmaports.

## Why it is empty in git

The blobs are proprietary (Qualcomm ADSP/modem/WLAN, Focaltech touch,
QCA Bluetooth, Adreno zap, etc.). They must be extracted from a real
device or from an official Xiaomi fastboot ROM.

See:
- docs/BUILD.md  → section "2. Firmware"
- docs/DOWNLOADS.md  → Firmware table

## Required layout (what the APKBUILD and build scripts expect)

```
build/firmware/
├─ qcom/sm6225/xiaomi/xun/
│   ├─ adsp.*
│   ├─ modem.*
│   ├─ wlanmdsp.mbn
│   ├─ bdwlan*
│   └─ bd84*
├─ qcom/sm4250/SM6225-Xun-tplg.bin   # built by build/mktplg.sh
├─ qcom/a610_zap.*
├─ qcom/a630_sqe.fw
├─ focaltech_ts_fw_*.bin
├─ ath10k/WCN3990/hw1.0/
│   ├─ wlanmdsp.mbn
│   ├─ board-2.bin
│   └─ firmware-5.bin
└─ qca/
    ├─ crbtfw13.tlv
    └─ crnv13.bin
```

## How to populate

1. On a running stock Android install (or from a full partition dump):
   - Mount `modem_a` (vfat) and copy the ADSP / modem / WLAN files.
   - Extract touch firmware from the `vendor` partition.
   - Extract Bluetooth firmware from `bluetooth_a` and rename to the `cr*` names.
2. Or unpack an official Xiaomi fastboot `.tgz`, then extract the relevant
   partition images and pull the same files.
3. Once the files are present, run:
   ```sh
   ./scripts/sync-pmaports.sh
   ```
   to regenerate the firmware tarball used by the APKBUILD.

The CI workflow can also accept a pre-made `firmware-xiaomi-xun.tar.gz` via
the `firmware_url` input.
EOF

          echo "Created build/firmware tree + README"

      - name: Optionally download pre-extracted firmware
        if: ${{ inputs.firmware_url != '' }}
        run: |
          set -eux
          curl -L --fail -o /tmp/firmware-xiaomi-xun.tar.gz "${{ inputs.firmware_url }}"
          tar -tzf /tmp/firmware-xiaomi-xun.tar.gz | head
          # Extract into the expected location (adjust if your tarball layout differs)
          tar -xzf /tmp/firmware-xiaomi-xun.tar.gz -C build/firmware --strip-components=1 || \
          tar -xzf /tmp/firmware-xiaomi-xun.tar.gz -C build/
          echo "Firmware archive extracted"
          find build/firmware -type f | head -30

      - name: Prepare pmaports overlay
        run: |
          set -eux
          # Clone official pmaports (edge channel is what this port targets)
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/pmaports

          # Overlay the three packages from this repository
          mkdir -p /tmp/pmaports/device/testing
          rsync -a pmaports/device/testing/device-xiaomi-xun/ \
                   /tmp/pmaports/device/testing/device-xiaomi-xun/
          rsync -a pmaports/device/testing/linux-postmarketos-qcom-sm6225/ \
                   /tmp/pmaports/device/testing/linux-postmarketos-qcom-sm6225/
          rsync -a pmaports/device/testing/firmware-xiaomi-xun/ \
                   /tmp/pmaports/device/testing/firmware-xiaomi-xun/

          echo "Overlapped packages:"
          ls -la /tmp/pmaports/device/testing/ | grep -E 'xiaomi-xun|sm6225|firmware'

      - name: Non-interactive pmbootstrap init
        run: |
          set -eux
          # Create a minimal non-interactive config
          # (pmbootstrap init is interactive by default; we drive it with answers)
          export PMB_WORK=/tmp/pmbootstrap-work
          mkdir -p "$PMB_WORK"

          # First run creates the config skeleton
          pmbootstrap --work "$PMB_WORK" config aports /tmp/pmaports || true

          # Force the device + UI we care about
          # (these are the keys pmbootstrap stores)
          pmbootstrap --work "$PMB_WORK" config device xiaomi-xun
          pmbootstrap --work "$PMB_WORK" config ui "${{ inputs.ui }}"
          pmbootstrap --work "$PMB_WORK" config user xun
          pmbootstrap --work "$PMB_WORK" config hostname xun
          pmbootstrap --work "$PMB_WORK" config timezone UTC
          pmbootstrap --work "$PMB_WORK" config locale en_US.UTF-8

          echo "=== pmbootstrap config ==="
          pmbootstrap --work "$PMB_WORK" config

      - name: List available UIs / GUIs
        run: |
          set -eux
          echo "============================================================"
          echo "Available postmarketOS UIs (from official pmaports main/)"
          echo "============================================================"
          ls /tmp/pmaports/main/ | grep '^postmarketos-ui-' | sed 's/postmarketos-ui-//' | sort

          echo ""
          echo "Common / recommended ones for tablets:"
          echo "  - gnome          (what this port is built and tested with)"
          echo "  - phosh          (mobile-friendly GNOME Shell variant)"
          echo "  - plasma-mobile  (KDE)"
          echo "  - sxmo-de-sway   (simple mobile)"
          echo "  - xfce4"
          echo "  - console / none"

          echo ""
          echo "Current selection for this run: ${{ inputs.ui }}"

      - name: Status summary
        run: |
          set -eux
          echo "============================================================"
          echo "Setup complete"
          echo "============================================================"
          echo "build/firmware tree: present (see build/firmware/README.md)"
          echo "pmbootstrap: installed"
          echo "pmaports: overlaid with xiaomi-xun packages"
          echo "Device: xiaomi-xun"
          echo "UI:     ${{ inputs.ui }}"
          echo ""
          echo "Next manual steps on a real host:"
          echo "  1. Populate build/firmware (docs/BUILD.md)"
          echo "  2. ./scripts/sync-pmaports.sh"
          echo "  3. pmbootstrap init   # (or use the config already written)"
          echo "  4. pmbootstrap install"
          echo "  5. Build the v4 boot image with ./build/build-xun.sh"
