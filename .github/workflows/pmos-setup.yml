name: Firmware Extract + Commit (xun)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct URL to Xiaomi fastboot .tgz"
        required: false
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VMUMIXM/xun_global_images_OS2.0.209.0.VMUMIXM_20260622.0000.00_15.0_global_0dee6f46cf.tgz"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip android-sdk-libsparse-utils dosfstools

      - name: Download ROM
        run: |
          echo "Downloading Xiaomi fastboot ROM..."
          curl -L --fail --retry 3 --retry-delay 15 \
            -o /tmp/xun.tgz \
            "${{ inputs.rom_url }}"
          ls -lh /tmp/xun.tgz

      - name: Extract ROM
        run: |
          mkdir -p /tmp/rom
          tar -xzf /tmp/xun.tgz -C /tmp/rom
          find /tmp/rom -type d -name images | head -1 > /tmp/imgdir
          echo "Images dir: $(cat /tmp/imgdir)"
          ls -lh "$(cat /tmp/imgdir)" | head -30

      - name: Extract firmware blobs
        run: |
          set -e
          IMGDIR=$(cat /tmp/imgdir)
          mkdir -p /tmp/mnt/modem /tmp/mnt/bt

          # Modem
          MODEM=$(find "$IMGDIR" -iname modem.img | head -1 || true)
          if [ -n "$MODEM" ]; then
            if file "$MODEM" | grep -qi sparse; then
              simg2img "$MODEM" /tmp/modem.raw
            else
              cp "$MODEM" /tmp/modem.raw
            fi
            sudo mount -o loop,ro /tmp/modem.raw /tmp/mnt/modem || true
            ls /tmp/mnt/modem/ || true
            ls /tmp/mnt/modem/image/ 2>/dev/null || true
          fi

          # Bluetooth
          BT=$(find "$IMGDIR" -iname bluetooth.img | head -1 || true)
          if [ -n "$BT" ]; then
            if file "$BT" | grep -qi sparse; then
              simg2img "$BT" /tmp/bt.raw
            else
              cp "$BT" /tmp/bt.raw
            fi
            sudo mount -o loop,ro /tmp/bt.raw /tmp/mnt/bt || true
            ls /tmp/mnt/bt/ || true
            ls /tmp/mnt/bt/image/ 2>/dev/null || true
          fi

          # Collect
          FW=build/firmware
          mkdir -p $FW/qcom/sm6225/xiaomi/xun $FW/qca

          if [ -d /tmp/mnt/modem/image ]; then
            cp -v /tmp/mnt/modem/image/adsp*        $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/mnt/modem/image/modem*       $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/mnt/modem/image/wlanmdsp.mbn $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/mnt/modem/image/bdwlan*      $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
            cp -v /tmp/mnt/modem/image/bd84*        $FW/qcom/sm6225/xiaomi/xun/ 2>/dev/null || true
          fi

          if [ -d /tmp/mnt/bt/image ]; then
            cp -v /tmp/mnt/bt/image/cmbtfw13.tlv $FW/qca/crbtfw13.tlv 2>/dev/null || true
            cp -v /tmp/mnt/bt/image/cmnv13.bin   $FW/qca/crnv13.bin   2>/dev/null || true
          fi

          echo "=== Collected files ==="
          find $FW -type f | sort
          du -sh $FW

      - name: Commit firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/firmware/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "firmware: add extracted blobs for xiaomi-xun"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiaomi-xun
          path: build/firmware/
          retention-days: 30
