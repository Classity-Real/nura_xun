name: Commit mini.tar.gz into repo

# One-shot: download Alpine minirootfs and commit it as build/rootfs-work/mini.tar.gz
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mini.tar.gz
        run: |
          set -eux
          mkdir -p build/rootfs-work
          curl -fL --retry 5 --retry-delay 3 \
            -o build/rootfs-work/mini.tar.gz \
            "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/alpine-minirootfs-3.24.0-aarch64.tar.gz"
          ls -lh build/rootfs-work/mini.tar.gz
          tar -tzf build/rootfs-work/mini.tar.gz | head -5

      - name: Commit and push
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/rootfs-work/mini.tar.gz
          if git diff --cached --quiet; then
            echo "Already present"
          else
            git commit -m "Add Alpine 3.24.0 aarch64 minirootfs as build/rootfs-work/mini.tar.gz"
            git push
          fi
