name: Extract Firmware from Xiaomi ROM

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Direct URL to Xiaomi fastboot tgz
        required: false
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VMUMIXM/xun_global_images_OS2.0.209.0.VMUMIXM_20260622.0000.00_15.0_global_0dee6f46cf.tgz

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip android-sdk-libsparse-utils dosfstools file tree

      - name: Download ROM
        run: |
          echo "Downloading ROM..."
          curl -L --fail --retry 3 --retry-delay 10 -o /tmp/xun.tgz "${{ inputs.rom_url }}"
          ls -lh /tmp/xun.tgz

      - name: Unpack and inspect ROM layout
        run: |
          mkdir -p /tmp/rom
          tar -xzf /tmp/xun.tgz -C /tmp/rom

          echo "=== Full tree (depth 4) ==="
          find /tmp/rom -maxdepth 4 -type d | sort

          echo ""
          echo "=== Looking for images directory ==="
          find /tmp/rom -type d -name images | tee /tmp/imgdir

          IMGDIR=$(cat /tmp/imgdir | head -1)
          echo "Using: $IMGDIR"

          echo ""
          echo "=== ALL files in images/ ==="
          ls -lh "$IMGDIR"

          echo ""
          echo "=== Files that look like modem / bluetooth / non-hlos / firmware ==="
          find "$IMGDIR" -iname "*modem*" -o -iname "*bluetooth*" -o -iname "*non-hlos*" -o -iname "*dsp*" -o -iname "*adsp*" -o -iname "*wlan*" -o -iname "*bt*" | sort

          echo ""
          echo "=== File types of interesting candidates ==="
          find "$IMGDIR" -iname "*modem*" -o -iname "*bluetooth*" -o -iname "*non-hlos*" | while read f; do
            echo "--- $f ---"
            file "$f"
            ls -lh "$f"
          done

      - name: Keep artifact of the file list
        run: |
          find /tmp/rom -type f | sort > /tmp/rom-filelist.txt
          ls -lh /tmp/rom-filelist.txt

      - name: Upload file list artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-layout
          path: /tmp/rom-filelist.txt
