name: Extract Firmware from Xiaomi ROM

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Direct URL to Xiaomi fastboot tgz
        required: false
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VMUMIXM/xun_global_images_OS2.0.209.0.VMUMIXM_20260622.0000.00_15.0_global_0dee6f46cf.tgz

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip android-sdk-libsparse-utils dosfstools

      - name: Download ROM
        run: |
          echo "Downloading ROM..."
          curl -L --fail --retry 3 --retry-delay 10 -o /tmp/xun.tgz "${{ inputs.rom_url }}"
          ls -lh /tmp/xun.tgz

      - name: Unpack ROM
        run: |
          mkdir -p /tmp/rom
          tar -xzf /tmp/xun.tgz -C /tmp/rom
          find /tmp/rom -type d -name images | head -1 | tee /tmp/imgdir
          ls -lh "$(cat /tmp/imgdir)" | head -20

      - name: Pull firmware files
        run: |
          set -e
          IMGDIR=$(cat /tmp/imgdir)
          mkdir -p /tmp/mnt/modem /tmp/mnt/bt build/firmware/qcom/sm6225/xiaomi/xun build/firmware/qca

          MODEM=$(find "$IMGDIR" -iname modem.img | head -1 || true)
          if [ -n "$MODEM" ]; then
            if file "$MODEM" | grep -qi sparse; then
              simg2img "$MODEM" /tmp/modem.raw
            else
              cp "$MODEM" /tmp/modem.raw
            fi
            sudo mount -o loop,ro /tmp/modem.raw /tmp/mnt/modem || true
          fi

          BT=$(find "$IMGDIR" -iname bluetooth.img | head -1 || true)
          if [ -n "$BT" ]; then
            if file "$BT" | grep -qi sparse; then
              simg2img "$BT" /tmp/bt.raw
            else
              cp "$BT" /tmp/bt.raw
            fi
            sudo mount -o loop,ro /tmp/bt.raw /tmp/mnt/bt || true
          fi

          if [ -d /tmp/mnt/modem/image ]; then
            cp -v /tmp/mnt/modem/image/adsp*        build/firmware/qcom/sm6225/xiaomi/xun/ || true
            cp -v /tmp/mnt/modem/image/modem*       build/firmware/qcom/sm6225/xiaomi/xun/ || true
            cp -v /tmp/mnt/modem/image/wlanmdsp.mbn build/firmware/qcom/sm6225/xiaomi/xun/ || true
            cp -v /tmp/mnt/modem/image/bdwlan*      build/firmware/qcom/sm6225/xiaomi/xun/ || true
            cp -v /tmp/mnt/modem/image/bd84*        build/firmware/qcom/sm6225/xiaomi/xun/ || true
          fi

          if [ -d /tmp/mnt/bt/image ]; then
            cp -v /tmp/mnt/bt/image/cmbtfw13.tlv build/firmware/qca/crbtfw13.tlv || true
            cp -v /tmp/mnt/bt/image/cmnv13.bin   build/firmware/qca/crnv13.bin || true
          fi

          echo "=== Result ==="
          find build/firmware -type f | sort
          du -sh build/firmware

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/firmware/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "firmware: add extracted blobs for xiaomi-xun"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiaomi-xun
          path: build/firmware/
