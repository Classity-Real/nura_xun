name: Build xun kernel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options:
          - both
          - boot
          - userdata
        default: both
      touch_mode:
        description: "FT8203 touch reporting mode"
        type: choice
        options:
          - absolute
          - mouse
        default: absolute
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-xun.yml"

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'boot' || inputs.target == 'both' }}
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and kernel work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/src
            build/work
            build/downloads
            build/tools
            build/rootfs-work
            build/tapas-bringup
            build/tapas-images

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tar patch git curl file \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            python3 cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Fetch sources
        working-directory: build
        run: |
          chmod +x fetch-sources.sh || true
          bash fetch-sources.sh

      - name: Sync pmaports
        run: |
          chmod +x scripts/sync-pmaports.sh || true
          bash scripts/sync-pmaports.sh

      - name: Build kernel + boot image
        working-directory: build
        env:
          TOUCH_MODE: ${{ inputs.touch_mode || 'absolute' }}
        run: |
          chmod +x build-xun.sh || true
          bash build-xun.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload boot image (GitHub)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img

      - name: Upload boot image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img
          compression-level: 0

  install-image:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'userdata' || inputs.target == 'both' }}
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build downloads
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/downloads
            build/rootfs-work
            build/tools

      - name: Install deps for install image
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            docker.io \
            qemu-user-static binfmt-support \
            curl tar gzip file

          sudo systemctl start docker || sudo service docker start || true
          sudo chmod 666 /var/run/docker.sock || true
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

          docker version
          which img2simg || sudo which img2simg
          docker run --rm --platform linux/arm64 alpine:3.24 uname -m

      - name: Ensure mini.tar.gz (prefer in-repo file)
        working-directory: build
        run: |
          set -eux
          mkdir -p rootfs-work
          if [ -s rootfs-work/mini.tar.gz ] && tar -tzf rootfs-work/mini.tar.gz >/dev/null 2>&1; then
            echo "Using in-repo/cache mini.tar.gz"
          else
            echo "Downloading mini.tar.gz"
            curl -fL --retry 5 --retry-delay 3 \
              -o rootfs-work/mini.tar.gz \
              "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/alpine-minirootfs-3.24.0-aarch64.tar.gz"
          fi
          ls -lh rootfs-work/mini.tar.gz
          tar -tzf rootfs-work/mini.tar.gz | head -5

      - name: Ensure firmware tree exists
        run: |
          set -eux
          mkdir -p build/firmware/qcom/sm6225/xiaomi/xun build/firmware/qca
          find build/firmware -type f | head -20 || true
          du -sh build/firmware || true

      - name: Build full install image (Alpine + GNOME rootfs)
        working-directory: build
        run: |
          set -eux
          test -s rootfs-work/mini.tar.gz
          chmod +x make-install-image.sh install-image-inner.sh || true
          if ! bash make-install-image.sh; then
            echo "===== make-install-image.sh FAILED ====="
            ls -la out/ || true
            ls -la rootfs-work/ || true
            docker ps -a || true
            df -h || true
            exit 1
          fi
          ls -lh out/xun-install.img out/xun-install.img.sparse

      - name: Upload install image (GitHub, fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse

      - name: Upload install image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse
          compression-level: 0
