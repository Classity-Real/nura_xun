name: Build xun kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-xun.yml"

jobs:
  build:
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and kernel work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/src
            build/work
            build/downloads
            build/tools
            build/rootfs-work
            build/tapas-bringup
            build/tapas-images

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tar patch git curl \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            python3 cpio

      - name: Fetch sources
        working-directory: build
        run: |
          chmod +x fetch-sources.sh || true
          bash fetch-sources.sh

      - name: Sync pmaports
        run: |
          chmod +x scripts/sync-pmaports.sh || true
          bash scripts/sync-pmaports.sh

      - name: Build kernel + boot image
        working-directory: build
        run: |
          chmod +x build-xun.sh || true
          bash build-xun.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload boot image (GitHub)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img

      - name: Upload boot image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img
          compression-level: 0

  install-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and rootfs work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/rootfs-work
            build/downloads
            build/tools

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            docker.io \
            qemu-user-static binfmt-support \
            curl tar gzip file

          sudo systemctl start docker || sudo service docker start || true
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

          docker version
          which img2simg
          docker run --rm --platform linux/arm64 alpine:3.24 uname -m

      - name: Require existing mini.tar.gz (no fetch)
        working-directory: build
        run: |
          set -eux
          if [ ! -s rootfs-work/mini.tar.gz ]; then
            echo "Missing build/rootfs-work/mini.tar.gz"
            echo "Download once:"
            echo "  curl -L -o build/rootfs-work/mini.tar.gz \\"
            echo "    https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/alpine-minirootfs-3.24.0-aarch64.tar.gz"
            exit 1
          fi
          tar -tzf rootfs-work/mini.tar.gz | head -5
          ls -lh rootfs-work/mini.tar.gz

      - name: Ensure firmware tree exists
        run: |
          set -eux
          mkdir -p build/firmware/qcom/sm6225/xiaomi/xun build/firmware/qca
          find build/firmware -type f | head -20 || true
          du -sh build/firmware || true

      - name: Build full install image (Alpine + GNOME rootfs)
        working-directory: build
        run: |
          set -eux
          test -s rootfs-work/mini.tar.gz
          chmod +x make-install-image.sh || true
          bash make-install-image.sh
          ls -lh out/xun-install.img out/xun-install.img.sparse

      - name: Upload install image (GitHub, fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse

      - name: Upload install image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse
          compression-level: 0
