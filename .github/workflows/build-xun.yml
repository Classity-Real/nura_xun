name: Build xun kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-xun.yml"

jobs:
  build:
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and kernel work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/src
            build/work
            build/downloads
            build/tools
            build/rootfs-work
            build/tapas-bringup
            build/tapas-images

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tar patch git curl \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            python3 cpio

      - name: Fetch sources
        working-directory: build
        run: ./fetch-sources.sh

      - name: Sync pmaports
        run: ./scripts/sync-pmaports.sh

      - name: Build kernel + boot image
        working-directory: build
        run: ./build-xun.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload boot image (GitHub)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img

      - name: Upload boot image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img
          compression-level: 0

  # Full Alpine+GNOME image is heavy — only on manual dispatch
  install-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and rootfs work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/rootfs-work
            build/downloads
            build/tools

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            docker.io \
            qemu-user-static binfmt-support \
            curl tar gzip file

          sudo systemctl start docker || sudo service docker start || true
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

          docker version
          which img2simg
          docker run --rm --platform linux/arm64 alpine:3.24 uname -m

      - name: Fetch sources
        working-directory: build
        run: ./fetch-sources.sh

      - name: Force Alpine minirootfs into place
        working-directory: build
        run: |
          set -eux
          mkdir -p rootfs-work

          # Always re-validate; cache often leaves a 0-byte or missing file
          NEED_DOWNLOAD=0
          if [ ! -s rootfs-work/mini.tar.gz ]; then
            NEED_DOWNLOAD=1
          elif ! tar -tzf rootfs-work/mini.tar.gz >/dev/null 2>&1; then
            echo "existing mini.tar.gz is corrupt — re-downloading"
            rm -f rootfs-work/mini.tar.gz
            NEED_DOWNLOAD=1
          fi

          if [ "$NEED_DOWNLOAD" = 1 ]; then
            # Try several mirrors / naming strategies
            downloaded=0
            for base in \
              "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64" \
              "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64" \
              "https://mirrors.aliyun.com/alpine/latest-stable/releases/aarch64"; do

              echo "Trying mirror: $base"
              # Prefer the name advertised by latest-releases.yaml
              name=$(curl -fsSL "$base/latest-releases.yaml" 2>/dev/null \
                | grep -oE 'alpine-minirootfs-[0-9.]+-aarch64\.tar\.gz' | head -1 || true)

              if [ -z "$name" ]; then
                # Fallback candidates
                for cand in \
                  alpine-minirootfs-3.22.1-aarch64.tar.gz \
                  alpine-minirootfs-3.22.0-aarch64.tar.gz \
                  alpine-minirootfs-3.21.3-aarch64.tar.gz \
                  alpine-minirootfs-3.20.6-aarch64.tar.gz; do
                  if curl -fsI "$base/$cand" >/dev/null 2>&1; then
                    name=$cand
                    break
                  fi
                done
              fi

              if [ -n "$name" ]; then
                echo "Downloading $base/$name"
                if curl -fL --retry 5 --retry-delay 3 -o rootfs-work/mini.tar.gz "$base/$name"; then
                  if tar -tzf rootfs-work/mini.tar.gz >/dev/null 2>&1; then
                    downloaded=1
                    break
                  fi
                  echo "download was not a valid tar.gz"
                  rm -f rootfs-work/mini.tar.gz
                fi
              fi
            done

            if [ "$downloaded" != 1 ]; then
              echo "FATAL: could not download a valid alpine-minirootfs"
              exit 1
            fi
          fi

          ls -lh rootfs-work/mini.tar.gz
          file rootfs-work/mini.tar.gz
          tar -tzf rootfs-work/mini.tar.gz | head -8

          # Absolute path check that matches what the container will see
          test -s "$PWD/rootfs-work/mini.tar.gz"
          echo "Host path ready: $PWD/rootfs-work/mini.tar.gz"

      - name: Sync pmaports
        run: ./scripts/sync-pmaports.sh

      - name: Ensure firmware tree exists
        run: |
          set -eux
          mkdir -p build/firmware/qcom/sm6225/xiaomi/xun build/firmware/qca
          find build/firmware -type f | head -20 || true
          du -sh build/firmware || true

      - name: Build full install image (Alpine + GNOME rootfs)
        working-directory: build
        run: |
          set -eux
          # Final guard right before docker
          test -s rootfs-work/mini.tar.gz
          ls -lh rootfs-work/mini.tar.gz
          ./make-install-image.sh
          ls -lh out/xun-install.img out/xun-install.img.sparse

      - name: Upload install image (GitHub, fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse

      - name: Upload install image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse
          compression-level: 0
