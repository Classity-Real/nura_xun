name: Build xun kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-xun.yml"

jobs:
  build:
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and kernel work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/src
            build/work
            build/downloads
            build/tools
            build/rootfs-work
            build/tapas-bringup
            build/tapas-images

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tar patch git curl \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            python3 cpio

      - name: Fetch sources
        working-directory: build
        run: ./fetch-sources.sh

      - name: Sync pmaports
        run: ./scripts/sync-pmaports.sh

      - name: Build kernel + boot image
        working-directory: build
        run: ./build-xun.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload boot image (GitHub)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img

      - name: Upload boot image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img
          compression-level: 0

  install-image:
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and rootfs work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/rootfs-work
            build/downloads
            build/tools

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            docker.io \
            qemu-user-static binfmt-support \
            curl tar gzip

          sudo systemctl start docker || sudo service docker start || true
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

          docker version
          which img2simg
          docker run --rm --platform linux/arm64 alpine:3.24 uname -m

      - name: Fetch sources
        working-directory: build
        run: ./fetch-sources.sh

      - name: Ensure Alpine minirootfs (mini.tar.gz)
        working-directory: build
        run: |
          set -eux
          mkdir -p rootfs-work

          # If cache left an empty or missing file, force a real download.
          if [ ! -s rootfs-work/mini.tar.gz ]; then
            echo "mini.tar.gz missing or empty — downloading"
            # Resolve latest name from the mirror, with a pinned fallback.
            MINI=$(curl -fsSL "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/latest-releases.yaml" \
              | grep -oE 'alpine-minirootfs-[0-9.]+-aarch64\.tar\.gz' | head -1 || true)

            if [ -z "$MINI" ]; then
              # Fallback: known recent 3.22 / 3.23 style name pattern — try common ones
              for cand in \
                alpine-minirootfs-3.22.0-aarch64.tar.gz \
                alpine-minirootfs-3.21.3-aarch64.tar.gz \
                alpine-minirootfs-3.20.6-aarch64.tar.gz; do
                if curl -fsI "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/$cand" >/dev/null 2>&1; then
                  MINI=$cand
                  break
                fi
              done
            fi

            if [ -z "$MINI" ]; then
              echo "Could not resolve alpine-minirootfs name"
              exit 1
            fi

            echo "Downloading $MINI"
            curl -fL --retry 5 --retry-delay 5 \
              -o rootfs-work/mini.tar.gz \
              "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64/$MINI"
          fi

          ls -lh rootfs-work/mini.tar.gz
          # Must be a real gzip tarball, not an HTML error page
          file rootfs-work/mini.tar.gz | grep -qi 'gzip\|tar' 
          tar -tzf rootfs-work/mini.tar.gz | head -5

      - name: Sync pmaports
        run: ./scripts/sync-pmaports.sh

      - name: Ensure firmware tree exists
        run: |
          set -eux
          mkdir -p build/firmware/qcom/sm6225/xiaomi/xun build/firmware/qca
          find build/firmware -type f | head -20 || true
          du -sh build/firmware || true

      - name: Build full install image (Alpine + GNOME rootfs)
        working-directory: build
        run: |
          set -eux
          ./make-install-image.sh
          ls -lh out/xun-install.img out/xun-install.img.sparse

      - name: Upload install image (GitHub, fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse

      - name: Upload install image (Namespace mirror)
        if: success()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: xun-install-img-sparse
          path: build/out/xun-install.img.sparse
          compression-level: 0
