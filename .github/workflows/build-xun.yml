name: Build xun kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-xun.yml"

jobs:
  build:
    runs-on: namespace-profile-workshop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build/ downloads and kernel work dir
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            build/src
            build/work
            build/downloads
            build/tools
            build/rootfs-work
            build/tapas-bringup
            build/tapas-images

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tar patch git curl \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            python3 cpio

      - name: Fetch sources
        working-directory: build
        run: ./fetch-sources.sh

      - name: Sync pmaports
        run: ./scripts/sync-pmaports.sh

      # Touch and Bluetooth firmware can only come off the physical tablet
      # (see docs/BUILD.md / DOWNLOADS.md) so CI has no real source for them.
      # CONFIG_EXTRA_FIRMWARE still needs the files to exist to compile; a
      # 1-byte placeholder satisfies the build rule without claiming to be
      # real firmware. This makes the CI image a compile check only — it is
      # not flashable/complete. A real build still needs the tablet-extracted
      # files in build/firmware/.
      - name: Create CI-only firmware placeholders (not for flashing)
        working-directory: build
        run: |
          mkdir -p firmware/qca
          for f in \
            firmware/focaltech_ts_fw_huaxing_ft8203.bin \
            firmware/focaltech_ts_fw_boe_ft8203.bin \
            firmware/qca/crbtfw13.tlv \
            firmware/qca/crnv13.bin; do
            [ -s "$f" ] || printf '\0' > "$f"
          done

      - name: Build kernel + boot image
        working-directory: build
        run: ./build-xun.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-xun-img
          path: build/out/boot-xun.img
